version: '3.9'

# Development environment with hot reload
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: viajero-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: viajero_conectado
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - viajero-dev-network

  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: viajero-mongo-dev
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_dev_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - viajero-dev-network

  # Redis Cache & Queues
  redis:
    image: redis:7-alpine
    container_name: viajero-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - viajero-dev-network

volumes:
  postgres_dev_data:
    driver: local
  mongodb_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  viajero-dev-network:
    driver: bridge
