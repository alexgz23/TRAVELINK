apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: viajero-ingress
  namespace: viajero-conectado
  annotations:
    # Nginx Ingress Controller annotations
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "10"

    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://viajeroconectado.com"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";

    # Cert Manager for SSL
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Connection settings
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

    # WebSocket support
    nginx.ingress.kubernetes.io/websocket-services: "viajero-backend"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"

spec:
  tls:
    - hosts:
        - viajeroconectado.com
        - www.viajeroconectado.com
        - api.viajeroconectado.com
      secretName: viajero-tls

  rules:
    # Frontend (main domain)
    - host: viajeroconectado.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: viajero-frontend
                port:
                  number: 3000

    # Frontend (www subdomain)
    - host: www.viajeroconectado.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: viajero-frontend
                port:
                  number: 3000

    # Backend API
    - host: api.viajeroconectado.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: viajero-backend
                port:
                  number: 4000

---
# ClusterIssuer for Let's Encrypt (requires cert-manager)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@viajeroconectado.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
