apiVersion: v1
kind: ConfigMap
metadata:
  name: viajero-config
  namespace: viajero-conectado
data:
  # Backend configuration
  NODE_ENV: "production"
  PORT: "4000"

  # Database configuration
  DB_PORT: "5432"
  DB_NAME: "viajero_conectado"

  # Redis configuration
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # MongoDB configuration
  MONGO_DB: "viajero_conectado_chat"

  # Elasticsearch configuration
  ELASTICSEARCH_URL: "http://elasticsearch:9200"

  # JWT configuration
  JWT_EXPIRES_IN: "7d"
  JWT_REFRESH_EXPIRES_IN: "30d"

  # AWS configuration
  AWS_REGION: "us-east-1"

  # Email configuration
  SMTP_PORT: "587"

  # Frontend configuration
  NEXT_PUBLIC_API_URL: "https://api.viajeroconectado.com/api/v1"
  NEXT_PUBLIC_WS_URL: "wss://api.viajeroconectado.com"
  NEXT_PUBLIC_APP_URL: "https://viajeroconectado.com"
